[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "nervegear-benchmark"
version = "0.1.0"
description = "CPU-only causal EMG decoding research pilot"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "h5py==3.14.0"]

[project.optional-dependencies]
dev = ["ruff==0.14.0", "build==1.3.0"]

[tool.setuptools.packages.find]
include = ["nervegear_benchmark*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
